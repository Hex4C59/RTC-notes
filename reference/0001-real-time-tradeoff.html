<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTC 入门速查卡</title><link rel="stylesheet" href="../assets/rtc-teach.css"></head><body><main><p class="eyebrow">教学速查 · 非掌握认证</p><h1>完整收到 ≠ 及时交互</h1><p>实时声音持续产生、持续播放。除了数据质量，还要关注它是否及时到达；迟到的数据通常失去当前播放价值。</p><div class="callout">思考取舍时问：等这段数据，会不会耽误接下来的对话？</div><p>边界：这不意味着可以任意丢包，也不意味着禁止重传；恢复是否有价值，要结合剩余时间和媒体需求判断。</p><p>依据：<a href="https://www.rfc-editor.org/rfc/rfc8836.html#section-1">RFC 8836 §1</a>。取舍问题是依据其时限约束设计的教学提示，不是统一算法。</p><nav><a href="../lessons/0001-why-real-time.html">返回第一课与练习</a></nav></main></body></html>
